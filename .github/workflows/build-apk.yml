name: Build & Publish MycoConserve Pro APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug.keystore and .env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-configuration-cache

      - name: Rename APK to MycoConserve-Pro.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk MycoConserve-Pro.apk

      - name: Upload APK in Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MycoConserve-Pro-APK
          path: MycoConserve-Pro.apk

      - name: Publish APK in GitHub Releases (1-Click Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: "MycoConserve Pro — Télécharger l'APK Android"
          body: "Cliquez sur **MycoConserve-Pro.apk** ci-dessous pour télécharger et installer l'application sur votre téléphone Android."
          files: MycoConserve-Pro.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
